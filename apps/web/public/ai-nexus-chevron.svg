<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="AI Nexus">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a2128"/><stop offset="1" stop-color="#0d1216"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7ad70"/><stop offset="1" stop-color="#e2803c"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>
  <rect x="1" y="1" width="98" height="98" rx="22" fill="url(#surface)" stroke="#e87d2f" stroke-opacity=".45" stroke-width="1.5"/>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 2)">
    <g filter="url(#glow)" opacity=".75">
      <polyline points="22,50 50,22 78,50" stroke="#e87d2f" stroke-width="11"/>
      <polyline points="30,70 50,50 70,70" stroke="#e87d2f" stroke-width="9" opacity=".4"/>
    </g>
    <polyline points="22,50 50,22 78,50" stroke="url(#accent)" stroke-width="10"/>
    <polyline points="30,70 50,50 70,70" stroke="#e87d2f" stroke-width="8" opacity=".45"/>
  </g>
</svg>
